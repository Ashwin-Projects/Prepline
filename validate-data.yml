name: Validate Prepline data

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Validate dataset schemas and taxonomy references
        run: python scripts/validate_prepline_data.py
      - name: Run repository data tests
        run: python -m unittest discover -s tests -v
