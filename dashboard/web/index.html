<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PREPLINE: curriculum-to-interview alignment dashboard" />
    <title>PREPLINE dashboard</title>
    <script>
      // Apply the saved or system theme before first paint (no flash on the projector).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("prepline-theme"); } catch (e) {}
        if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
